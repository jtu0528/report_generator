<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${reportTitle}">校務部工作月報告</title>
    <style>
        /* A4 直向列印設定，上下適度留白 10mm */
        @page {
            size: A4 portrait;
            margin: 10mm 10mm 8mm 10mm;
            @bottom-center {
                content: "第 " counter(page) " 頁，共 " counter(pages) " 頁";
                font-family: 'msjh', sans-serif;
                font-size: 10px;
                color: #555;
            }
        }

        /* 全域字體放大至 11.5px，確保印出後清晰滿版 */
        body {
            font-family: 'msjh', 'Microsoft JhengHei', sans-serif;
            color: #000;
            line-height: 1.35;
            font-size: 11.5px;
        }

        .header-top {
            width: 100%;
            margin-bottom: 4px;
        }
        .header-top td {
            border: none;
            padding: 0;
            font-size: 10px;
            color: #444;
        }
        .header-title {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 6px 0;
            letter-spacing: 1px;
        }
        .header-branch {
            font-size: 12.5px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .header-branch span {
            text-decoration: underline;
            padding-left: 6px;
        }

        .section-title {
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* 表格樣式：內距擴展至 4.5px ~ 5px，填滿頁面空間 */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 8px;
            table-layout: fixed;
        }
        
        th, td {
            border: 1px solid #000;
            padding: 4.5px 2px;
            text-align: center;
            vertical-align: middle;
            font-size: 11px;
            word-wrap: break-word;
        }

        th {
            background-color: #d9d9d9;
            font-weight: bold;
            font-size: 11.5px;
        }

        .total-row th, .total-row td {
            background-color: #f0f0f0;
            font-weight: bold;
            font-size: 11.5px;
        }

        .text-left { 
            text-align: left; 
            padding-left: 6px;
            padding-right: 6px;
        }

        /* 強制換頁標籤 */
        .page-break-before { 
            page-break-before: always; 
        }

        /* 專案報告區塊樣式 */
        .project-section {
            margin-top: 15px;
            border-top: 1.5px dashed #666;
            padding-top: 10px;
        }
        .project-block { 
            margin-bottom: 10px; 
            padding-left: 6px; 
        }
        .project-name { 
            font-weight: bold; 
            font-size: 12.5px; 
            margin-bottom: 4px;
        }
        ul { 
            margin: 0; 
            padding-left: 20px; 
        }
        li { 
            margin-bottom: 3px; 
            font-size: 11.5px;
        }
    </style>
</head>
<body>

    <!-- ==================== 第 1 頁：三大營運數據總覽 ==================== -->
    <table class="header-top">
        <tr>
            <td style="text-align: left; font-weight: bold; width: 33%;">佳音英語 Joy English</td>
            <td style="text-align: center; width: 34%; font-weight: bold;">龍安 / 榮富 / 新昌隆分校</td>
            <td style="text-align: right; width: 33%;">www.joy.com.tw</td>
        </tr>
    </table>

    <div class="header-title" th:text="${reportTitle}">龍安/榮富/新昌隆 校務部工作月報告</div>
    <div class="header-branch">分校：<span th:text="${branchName}">新昌隆</span></div>

    <!-- 區塊 1：學生人數報告 (採用全括號語法杜絕 500 錯誤) -->
    <div class="section-title">學生人數報告</div>
    <table>
        <tr>
            <th style="width: 6%;">月份</th>
            <th style="width: 8%;">總人數</th>
            <th style="width: 9%;">班平均<br/>人數</th>
            <th style="width: 7%;">班級<br/>數</th>
            <th style="width: 7%;">TJ</th>
            <th style="width: 7%;">MJ</th>
            <th style="width: 7%;">E+RE</th>
            <th style="width: 7%;">BM</th>
            <th style="width: 11%;">國、高中<br/>人數</th>
            <th style="width: 13%;">小六生人數</th>
            <th style="width: 9%;">流失<br/>人數</th>
            <th style="width: 9%;">流失<br/>率</th>
        </tr>
        <tr>
            <td th:text="${studentStats['month']}"></td>
            <td th:text="${studentStats['totalStudents']}"></td>
            <td th:text="${studentStats['avgStudents']}"></td>
            <td th:text="${studentStats['classCount']}"></td>
            <td th:text="${studentStats['TJ']}"></td>
            <td th:text="${studentStats['MJ']}"></td>
            <td th:text="${studentStats['ERE']}"></td>
            <td th:text="${studentStats['BM']}"></td>
            <td th:text="${studentStats['juniorSeniorHigh']}"></td>
            <td th:text="${studentStats['gradePrimary']}"></td>
            <td th:text="${studentStats['churnCount']}"></td>
            <td th:text="${studentStats['churnRate']}"></td>
        </tr>
    </table>

    <!-- 區塊 2：每月招生人數 (100% 動態迴圈渲染，欄位班別隨 Excel 自動增減) -->
    <div class="section-title">每月招生人數</div>
    <table>
        <thead>
            <tr>
                <th th:each="header : ${enrollmentHeaders}" th:text="${header}"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${monthlyEnrollmentRows}">
                <td th:each="val : ${row}" th:text="${val}"></td>
            </tr>
            <tr class="total-row" th:if="${enrollmentTotalRow != null}">
                <td th:each="val : ${enrollmentTotalRow}" th:text="${val}"></td>
            </tr>
        </tbody>
    </table>

    <!-- 區塊 3：歷年月底人數統計報告 (110~115 年完整 6 年) -->
    <div class="section-title">歷年月底人數統計報告</div>
    <table>
        <tr>
            <th colspan="7" style="background-color: #d9d9d9; font-size: 11.5px; padding: 4px;">
                歷年月底人數統計 總人數(班級數)/班平均
            </th>
        </tr>
        <tr>
            <th style="width: 10%;">月份</th>
            <th style="width: 15%;">110 年</th>
            <th style="width: 15%;">111 年</th>
            <th style="width: 15%;">★112 年</th>
            <th style="width: 15%;">113 年</th>
            <th style="width: 15%;">114 年</th>
            <th style="width: 15%;">115 年</th>
        </tr>
        <tr th:each="row : ${historicalStats}">
            <td th:text="${row['month']}"></td>
            <td th:text="${row['y110']}"></td>
            <td th:text="${row['y111']}"></td>
            <td th:text="${row['y112']}"></td>
            <td th:text="${row['y113']}"></td>
            <td th:text="${row['y114']}"></td>
            <td th:text="${row['y115']}"></td>
        </tr>
        <tr class="total-row" th:if="${historicalAvg != null}">
            <td th:text="${historicalAvg['month']}">平均</td>
            <td th:text="${historicalAvg['y110']}"></td>
            <td th:text="${historicalAvg['y111']}"></td>
            <td th:text="${historicalAvg['y112']}"></td>
            <td th:text="${historicalAvg['y113']}"></td>
            <td th:text="${historicalAvg['y114']}"></td>
            <td th:text="${historicalAvg['y115']}"></td>
        </tr>
    </table>


    <!-- ==================== 第 2 頁：流失原因報告 + 專案報告 ==================== -->
    <div class="page-break-before"></div>

    <!-- 區塊 4：本月流失原因報告 (純動態依真實名冊展開) -->
    <div class="section-title" style="margin-top: 0;">本月流失原因報告</div>
    <table>
        <thead>
            <tr>
                <th style="width: 5%;">NO</th>
                <th style="width: 9%;">日期</th>
                <th style="width: 14%;">帶班老師</th>
                <th style="width: 9%;">班別</th>
                <th style="width: 17%;">學生姓名</th>
                <th style="width: 46%;">流失原因</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="churn : ${churnList}">
                <td th:text="${churn['no']}"></td>
                <td th:text="${churn['date']}"></td>
                <td th:text="${churn['teacher']}"></td>
                <td th:text="${churn['classType']}"></td>
                <td th:text="${churn['studentName']}"></td>
                <td class="text-left" style="padding-top: 4px; padding-bottom: 4px;" th:text="${churn['reason']}"></td>
            </tr>
        </tbody>
    </table>

    <!-- 區塊 5：專案報告 (若無內容或僅填「無」則整塊自動隱藏) -->
    <div class="project-section" th:if="${projects != null and not #lists.isEmpty(projects)}">
        <div class="section-title" style="margin-top: 0;">【專案報告】</div>
        <div class="project-block" th:each="proj : ${projects}" th:if="${proj.items != null and not #lists.isEmpty(proj.items)}">
            <div class="project-name" th:text="'◎ 報告人(' + ${proj.name} + ') :'"></div>
            <ul>
                <li th:each="item : ${proj.items}" th:text="${item}"></li>
            </ul>
        </div>
    </div>

</body>
</html>
